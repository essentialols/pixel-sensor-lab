  name: HAL binary patch - PopulateHalSensorInfo jump table
  script: "python3 one-liner: patch byte at offset 0x13289 from 0x00 to 0x9c"
  purpose: Map AOC type 12 (spectral) to com.google.sensor.color (0x10008) in the HAL's type switch
  result: Patch correct but ineffective. CreateHalClientSensorList has a higher-level filter that prevents type 12 from getting a BasicSensor object.
  verdict: PARTIAL - patch is valid but needs a second patch

